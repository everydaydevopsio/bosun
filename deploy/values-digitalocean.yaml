# Bosun on a single-node DigitalOcean Kubernetes cluster.
#
# Companion to docs/self-hosted-digitalocean.md. Copy this, change the two
# marked values, and pass it with `helm upgrade --install -f`.
#
# This is a single-node, non-HA deployment for reviewing your own repositories.
# It is not a multi-tenant service: a reviewer Job runs an untrusted agent over
# repository content with model credentials in its environment, so install the
# GitHub App only on repositories whose contributors you trust.

image:
  # Pin a release rather than tracking the chart's appVersion if you want
  # upgrades to be a deliberate act.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

review:
  provider: codex-bosun
  # One at a time, as a spend control rather than a safety one. Reviewer Jobs
  # now carry requests, so the scheduler will only place a second review where
  # it actually fits; what this bounds is how much model budget a busy
  # repository can spend at once.
  maxConcurrent: 1
  # Inherited from the chart unless you have measured otherwise. See
  # docs/self-hosted-digitalocean.md for how the defaults were derived.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  timeoutSeconds: 1800
  ttlSecondsAfterFinished: 3600
  # Who may spend model credits with "@bridgectl review".
  allowedAssociations: "OWNER,MEMBER,COLLABORATOR"

logging:
  format: json
  level: info

ingress:
  enabled: true
  className: nginx
  # CHANGE ME: the hostname whose DNS record points at this cluster.
  host: bosun.example.com
  tlsSecretName: bosun-tls
  annotations:
    # CHANGE ME if your ClusterIssuer has a different name.
    cert-manager.io/cluster-issuer: letsencrypt
    # The webhook body is small; this keeps a large request from reaching the
    # controller at all.
    nginx.ingress.kubernetes.io/proxy-body-size: 1m

# Restricts reviewer Jobs to DNS and outbound HTTPS, so an agent that reads a
# malicious instruction out of a pull request cannot reach the Kubernetes API
# or anything else inside the cluster. Leave this on.
networkPolicy:
  enabled: true

# The controller is a small Go process; the reviewer Jobs are what consume the
# node. These limits keep the controller alive when a review is running.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsUser: 1001

secrets:
  githubSecretName: bosun-github
  aiSecretName: bosun-ai
  webhookSecretName: bosun-webhook
