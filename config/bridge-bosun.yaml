# Extra bridgectl providers for Bosun. Merged with bridgectl's packaged
# providers by `bridgectl server start --config`.
#
# The packaged `codex` provider runs the interactive Codex TUI under a PTY, so
# its output stream is screen repaints rather than an answer. `codex exec` is
# Codex's non-interactive mode: it takes the prompt as an argument, writes plain
# text to stdout, and exits when it is done.
#
# `stream_json: true` opts the provider out of PTY allocation. The supervisor
# then reads stdout line by line and forwards any line that is not an
# Anthropic-shaped stream event as a raw output chunk — which is exactly what
# `codex exec` produces.
#
# Auth comes from $CODEX_HOME/auth.json, which internal/review/credentials.go writes from
# the CODEX_AUTH secret, so no provider-specific auth handling is needed.
# Local Kind snapshots are mounted at /repos/review.*. Hosted reviews create
# workspaces under /tmp/bosun-review/ws-*. bridgectl v1.4.4 rejects session
# paths outside its home unless these narrow roots are allowed.
allowed_paths:
  - /repos
  - /tmp/bosun-review

providers:
  codex-bosun:
    binary: "sh"
    args:
      - "-c"
      # Codex reads piped stdin even with a positional prompt. bridgectl keeps
      # its input pipe open, so use /dev/null for this argument-only provider.
      - 'CODEX_API_KEY="${CODEX_API_KEY:-${OPENAI_API_KEY:-}}" exec node /app/node_modules/@openai/codex/bin/codex.js exec --skip-git-repo-check --color never --sandbox read-only "$@" </dev/null'
      - "codex-bosun"
    startup_timeout: "120s"
    validate_startup: false
    startup_probe: "none"
    stream_json: true

  # Headless Claude: the adapter retains the final answer and a bounded summary
  # of denied tool calls. dontAsk denies operations outside the allowlist.
  # This is a tool permission policy, not an OS-level filesystem sandbox.
  claude-bosun:
    binary: "sh"
    args:
      - "-c"
      # Host-mounted snapshots have a different UID. Git 2.43 requires the
      # exact path in protected config; its /* suffix is not supported.
      - 'git config --global --add safe.directory "$PWD" && exec node /app/bosun/scripts/claude-review-adapter.js "$@" </dev/null'
      - "claude-bosun"
    startup_timeout: "120s"
    validate_startup: false
    startup_probe: "none"
    stream_json: true
