# Extra bridgectl providers for Bosun. Merged with bridgectl's packaged
# providers by `bridgectl server start --config`.
#
# The packaged `codex` provider runs the interactive Codex TUI under a PTY, so
# its output stream is screen repaints rather than an answer. `codex exec` is
# Codex's non-interactive mode. The Bosun adapter reads its JSON internally,
# forwarding only the final review and one allowlisted usage record.
#
# `stream_json: true` opts the provider out of PTY allocation. The supervisor
# then reads stdout line by line and forwards any line that is not an
# Anthropic-shaped stream event as a raw output chunk. Both adapters emit plain
# review text and a BOSUN_USAGE_V1 line; raw provider events stay private.
#
# Auth comes from $CODEX_HOME/auth.json, which internal/review/credentials.go writes from
# the CODEX_AUTH secret, so no provider-specific auth handling is needed.
# Local Kind snapshots are mounted at /repos/review.*. Hosted reviews create
# workspaces under /tmp/bosun-review/ws-*. bridgectl v1.4.4 rejects session
# paths outside its home unless these narrow roots are allowed.
allowed_paths:
  - /repos
  - /tmp/bosun-review

# `--sandbox danger-full-access` is deliberate, and only safe because of where
# this runs. Codex's read-only sandbox is bubblewrap, which needs to create a
# mount namespace; the reviewer Job drops every capability, forbids privilege
# escalation, and runs as UID 1001, so bwrap fails at startup with
# "Failed to make / slave: Permission denied" and no files are ever read.
#
# The Job is the sandbox. It is disposable, holds a token scoped to the single
# repository under review that expires within the hour, reaches the network
# only through the chart's NetworkPolicy (DNS and outbound 443, nothing inside
# the cluster), and has no Kubernetes API access. Running bwrap inside that is
# a boundary within a boundary; the outer one is the one that holds.
#
# This applies to the hosted path only. internal/localreview/provider_probe.go
# keeps --sandbox read-only because it runs on a developer's own machine, where
# bwrap works and the surrounding isolation does not exist.

providers:
  codex-bosun:
    binary: "sh"
    args:
      - "-c"
      # Codex reads piped stdin even with a positional prompt. bridgectl keeps
      # its input pipe open, so use /dev/null for this argument-only provider.
      - 'CODEX_API_KEY="${CODEX_API_KEY:-${OPENAI_API_KEY:-}}" exec node /app/bosun/scripts/codex-review-adapter.js "$@" </dev/null'
      - "codex-bosun"
    startup_timeout: "120s"
    validate_startup: false
    startup_probe: "none"
    stream_json: true

  # Headless Claude: the adapter retains the final answer and a bounded summary
  # of denied tool calls. dontAsk denies operations outside the allowlist.
  # This is a tool permission policy, not an OS-level filesystem sandbox.
  claude-bosun:
    binary: "sh"
    args:
      - "-c"
      # Host-mounted snapshots have a different UID. Git 2.43 requires the
      # exact path in protected config; its /* suffix is not supported.
      - 'git config --global --add safe.directory "$PWD" && exec node /app/bosun/scripts/claude-review-adapter.js "$@" </dev/null'
      - "claude-bosun"
    startup_timeout: "120s"
    validate_startup: false
    startup_probe: "none"
    stream_json: true
