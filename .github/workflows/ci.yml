name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          name: codecov-go
          fail_ci_if_error: false

  cli:
    name: CLI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the CLI
        # Written to /tmp so the build never leaves an unstamped bosun in the
        # working tree for a later step to pick up.
        run: go build -o /tmp/bosun ./cmd/bosun

      - name: CLI reports a version
        run: /tmp/bosun version

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Catches a broken release config on the PR that breaks it, rather than
      # mid-release after the tag has already been pushed.
      - name: Check the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.15.4'
          args: check --config .goreleaser.yaml

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/bosun
      - name: Render production values
        run: helm template bosun charts/bosun --set ingress.enabled=true > /tmp/bosun-prod.yaml
      - name: Production mode mounts the webhook secret
        run: grep -q 'secretKeyRef' /tmp/bosun-prod.yaml
      - name: Render development values
        run: helm template bosun charts/bosun --set development.enabled=true > /tmp/bosun-dev.yaml
      - name: Development mode installs without a webhook secret
        run: |
          grep -q 'name: bosun-bosun' /tmp/bosun-dev.yaml
          ! grep -q 'GITHUB_WEBHOOK_SECRET' /tmp/bosun-dev.yaml
      # The controller mints per-repository tokens, so it can create and delete
      # Secrets. It must never be able to read them: get or list here would let
      # a compromised controller enumerate every credential in the namespace,
      # which is the thing the per-Job token was introduced to prevent.
      - name: The controller cannot read Secrets
        run: |
          set -euo pipefail
          helm template bosun charts/bosun --show-only templates/rbac.yaml > /tmp/bosun-rbac.yaml
          verbs="$(awk '/resources: \["secrets"\]/{found=1} found && /verbs:/{print; exit}' /tmp/bosun-rbac.yaml)"
          echo "secrets verbs: $verbs"
          grep -q 'verbs: \["create", "delete"\]' <<<"$verbs"

      # Deployment.spec.selector is immutable, so changing it makes `helm upgrade`
      # fail for every existing install -- the release sits in `failed` while the
      # old pod keeps serving, which looks like nothing happened (#19). Neither
      # `helm lint` nor a fresh `helm install` can see that: both only ever
      # render or create, never patch. Pin the fields an upgrade cannot change.
      # Changing either one means renaming the Deployment and documenting the
      # migration, which is the only way out of an immutable-field change.
      - name: Deployment identity is pinned
        run: |
          set -euo pipefail
          helm template bosun charts/bosun --show-only templates/deployment.yaml > /tmp/bosun-deploy.yaml
          grep -qx '  name: bosun-bosun' /tmp/bosun-deploy.yaml
          selector="$(sed -n '/^  selector:/,/^  template:/p' /tmp/bosun-deploy.yaml)"
          grep -qx '      app.kubernetes.io/name: bosun' <<<"$selector"
          grep -qx '      app.kubernetes.io/instance: bosun' <<<"$selector"

      # The published chart must reference the image published alongside it. A
      # literal tag here silently drifts from the release; `latest` is never
      # pushed at all.
      - name: Rendered images track the chart appVersion
        run: |
          set -euo pipefail
          appVersion="$(grep '^appVersion:' charts/bosun/Chart.yaml | cut -d'"' -f2)"
          helm template bosun charts/bosun > /tmp/bosun-default.yaml
          grep -q "image: \"ghcr.io/everydaydevopsio/bosun:${appVersion}\"" /tmp/bosun-default.yaml
          grep -q "value: \"ghcr.io/everydaydevopsio/bosun:${appVersion}\"" /tmp/bosun-default.yaml
          ! grep -q ':latest' /tmp/bosun-default.yaml
      # Branch review duplicates the review the pull request itself triggers,
      # and both count against the namespace-wide maxConcurrent -- so a default
      # of true makes an ordinary push-then-open-a-PR cost two reviews and can
      # lose the pull-request one to a 503 GitHub never redelivers. The default
      # is the behaviour every install gets, so pin it.
      - name: Branch review is off by default
        run: |
          set -euo pipefail
          helm template bosun charts/bosun > /tmp/bosun-triggers.yaml
          grep -A1 'name: BOSUN_REVIEW_BRANCH_CREATED' /tmp/bosun-triggers.yaml | grep -q 'value: "false"'
          helm template bosun charts/bosun --set review.triggers.branchCreated=true > /tmp/bosun-branch-on.yaml
          grep -A1 'name: BOSUN_REVIEW_BRANCH_CREATED' /tmp/bosun-branch-on.yaml | grep -q 'value: "true"'

      # A delivery GitHub sends while every slot is busy, or while no
      # controller is listening, is never redelivered (#82). The queue, the
      # preStop pause, and a grace period long enough for pause plus the
      # controller's 25s drain are what keep those deliveries; pin them.
      - name: Deliveries are not dropped by default
        run: |
          set -euo pipefail
          helm template bosun charts/bosun --show-only templates/deployment.yaml > /tmp/bosun-delivery.yaml
          queued="$(grep -A1 'name: BOSUN_MAX_QUEUED_REVIEWS' /tmp/bosun-delivery.yaml | sed -n 's/.*value: "\([0-9]*\)"/\1/p')"
          echo "maxQueued=$queued"; [ "$queued" -gt 0 ]
          grep -q 'name: BOSUN_SWEEP_INTERVAL_SECONDS' /tmp/bosun-delivery.yaml
          sleep_s="$(sed -n '/preStop:/,/seconds:/s/.*seconds: \([0-9]*\)/\1/p' /tmp/bosun-delivery.yaml)"
          grace="$(sed -n 's/.*terminationGracePeriodSeconds: \([0-9]*\)/\1/p' /tmp/bosun-delivery.yaml)"
          echo "preStop=${sleep_s}s grace=${grace}s"
          [ "$sleep_s" -gt 0 ] && [ "$grace" -ge $((sleep_s + 25)) ]
          grep -qx '  replicas: 2' /tmp/bosun-delivery.yaml

      - name: Reviewer Jobs can be locked down
        run: |
          helm template bosun charts/bosun --set networkPolicy.enabled=true \
            | grep -q 'kind: NetworkPolicy'

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    # Static analysis of five scripts needs seconds. A limit here is about
    # hangs, not slowness: this job once sat for 41 minutes inside `apt-get
    # update` against an unresponsive Ubuntu mirror, and shellcheck itself has
    # an open report of hanging on 24.04 runners (actions/runner#3667).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scripts are executable
        run: |
          for f in scripts/*.sh; do
            [ -x "$f" ] || { echo "$f is not executable"; exit 1; }
          done
      # shellcheck ships in the runner image (0.9.0-1 on ubuntu-24.04), so
      # installing it added an Ubuntu mirror to this job's dependencies for no
      # gain. Printing the version records what actually ran, since the image
      # can bump it without notice.
      - run: shellcheck --version
      - run: shellcheck -S warning scripts/*.sh
      - run: bash -n scripts/*.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A release version written into prose is correct for exactly one release
      # and silently wrong afterwards: the reader installs the previous version
      # and nothing says so. docs/self-hosted-digitalocean.md pinned 0.1.1 until
      # 0.1.2 shipped. Resolve the version at run time instead.
      - name: Documentation does not hardcode a release version
        run: |
          set -euo pipefail
          if grep -rnE 'everydaydevopsio/bosun:[0-9]+\.[0-9]+\.[0-9]+|charts/bosun --version [0-9]+\.[0-9]+\.[0-9]+' docs README.md deploy; then
            echo "::error::documentation pins a Bosun release version; resolve it at run time instead"
            exit 1
          fi

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        # snapshot.ubuntu.com is down; install from the live archive until #99 reverts this.
        run: docker build --build-arg VERSION=ci --build-arg UBUNTU_SNAPSHOT=live -t bosun:test .

      - name: Go binary is present in the image
        run: docker run --rm --entrypoint test bosun:test -x /usr/local/bin/bosun

      - name: Bridgectl snapshot path contract
        run: scripts/smoke-bridge-path.sh bosun:test

      - name: Smoke test the image
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint /usr/local/bin/bosun bosun:test version)"
          [ "$version" = "bosun ci" ] || { echo "SMOKE TEST FAILED: $version"; exit 1; }
          echo "SMOKE TEST PASSED"

      # `bosun review` refuses to submit a Job when the image on the Kind node is
      # not labelled as Bosun, because the base image's own labels mean the image
      # has no bosun binary. A regression here would make every local review
      # refuse to run, so assert the label survives the build.
      - name: Image identifies itself as Bosun
        run: |
          set -euo pipefail
          title="$(docker image inspect bosun:test --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          if [ "$title" != "bosun" ]; then
            echo "image title label is '$title', want 'bosun'"
            exit 1
          fi

      # Reports without failing the build: the base image is bridgectl's, so a
      # newly published CVE would otherwise break every run in this repo with no
      # change here and no fix available to make. publish.yml scans the same way
      # and is likewise non-blocking -- see the note there for why gating on
      # these findings is not workable, and #14 for how they are tracked.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bosun:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
