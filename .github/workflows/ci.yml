name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_WEBHOOK_SECRET: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: azure/setup-helm@v4
      - run: helm lint charts/bosun
      - run: helm template bosun charts/bosun --set development.enabled=true >/tmp/bosun-dev.yaml
      - run: grep -q 'local-development-only' /tmp/bosun-dev.yaml
      - run: docker build -t bosun:test .
