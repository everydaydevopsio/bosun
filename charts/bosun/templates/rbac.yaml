apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bosun.fullname" . }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # patch releases a Job that was created suspended, once its credential
    # Secret exists. It is patch rather than update because the job controller
    # writes status.conditions[Suspended] the moment the Job exists, so an
    # update carrying the object Create returned is already stale. delete
    # removes a Job whose credential could not be stored, so a failed
    # submission does not hold a concurrency slot forever.
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # The controller creates one short-lived, repository-scoped token Secret per
    # reviewer Job, owned by that Job. It never reads Secrets: get and list are
    # deliberately absent so a compromised controller cannot enumerate the
    # cluster's credentials.
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bosun.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bosun.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bosun.fullname" . }}
