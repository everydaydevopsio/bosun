apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bosun.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: bosun }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bosun }
    spec:
      serviceAccountName: {{ include "bosun.fullname" . }}
      containers:
        - name: bosun
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: BOSUN_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: BOSUN_REVIEW_PROVIDER
              value: {{ .Values.review.provider | quote }}
            - name: BOSUN_REVIEW_IMAGE
              value: {{ .Values.review.image | quote }}
            - name: BOSUN_JOB_TTL_SECONDS
              value: {{ .Values.review.ttlSecondsAfterFinished | quote }}
            - name: BOSUN_GITHUB_TOKEN_SECRET
              value: {{ .Values.secrets.githubSecretName | quote }}
            - name: BOSUN_AI_SECRET
              value: {{ .Values.secrets.aiSecretName | quote }}
{{- if not .Values.development.enabled }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.webhookSecretName }}
                  key: secret
{{- else }}
            - name: GITHUB_WEBHOOK_SECRET
              value: "local-development-only"
{{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
{{ toYaml .Values.resources | indent 12 }}
