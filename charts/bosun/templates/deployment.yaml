apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bosun.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bosun.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bosun.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "bosun.fullname" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.runAsUser }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bosun
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
          env:
            - name: BOSUN_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: BOSUN_REVIEW_PROVIDER
              value: {{ .Values.review.provider | quote }}
            - name: BOSUN_REVIEW_IMAGE
              value: {{ .Values.review.image | default (printf "%s:%s" .Values.image.repository .Chart.AppVersion) | quote }}
            - name: BOSUN_JOB_TTL_SECONDS
              value: {{ .Values.review.ttlSecondsAfterFinished | quote }}
            - name: BOSUN_RUN_AS_USER
              value: {{ .Values.securityContext.runAsUser | quote }}
            - name: BOSUN_REVIEW_CPU_REQUEST
              value: {{ .Values.review.resources.requests.cpu | default "" | quote }}
            - name: BOSUN_REVIEW_MEMORY_REQUEST
              value: {{ .Values.review.resources.requests.memory | default "" | quote }}
            - name: BOSUN_REVIEW_CPU_LIMIT
              value: {{ .Values.review.resources.limits.cpu | default "" | quote }}
            - name: BOSUN_REVIEW_MEMORY_LIMIT
              value: {{ .Values.review.resources.limits.memory | default "" | quote }}
            - name: BOSUN_REVIEW_COMMAND
              value: {{ .Values.review.command | quote }}
            - name: BOSUN_ALLOWED_ASSOCIATIONS
              value: {{ .Values.review.allowedAssociations | quote }}
            - name: BOSUN_REVIEW_BRANCH_CREATED
              value: {{ .Values.review.triggers.branchCreated | quote }}
            - name: BOSUN_SENTINEL_INTERVAL_SECONDS
              value: {{ .Values.review.terminationSentinel.intervalSeconds | quote }}
            - name: BOSUN_MAX_CONCURRENT_REVIEWS
              value: {{ .Values.review.maxConcurrent | quote }}
            - name: BOSUN_MAX_QUEUED_REVIEWS
              value: {{ .Values.review.queue.maxQueued | quote }}
            - name: BOSUN_QUEUE_INTERVAL_SECONDS
              value: {{ .Values.review.queue.intervalSeconds | quote }}
            - name: BOSUN_QUEUE_TIMEOUT_SECONDS
              value: {{ .Values.review.queue.timeoutSeconds | quote }}
            - name: BOSUN_SWEEP_INTERVAL_SECONDS
              value: {{ .Values.review.sweep.intervalSeconds | quote }}
            - name: BOSUN_SWEEP_LOOKBACK_SECONDS
              value: {{ .Values.review.sweep.lookbackSeconds | quote }}
            - name: BOSUN_SWEEP_GRACE_SECONDS
              value: {{ .Values.review.sweep.graceSeconds | quote }}
            - name: BOSUN_SWEEP_MAX_PER_PASS
              value: {{ .Values.review.sweep.maxPerPass | quote }}
            - name: BOSUN_REVIEW_TIMEOUT_SECONDS
              value: {{ .Values.review.timeoutSeconds | quote }}
            - name: BOSUN_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: BOSUN_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: BOSUN_GITHUB_TOKEN_SECRET
              value: {{ .Values.secrets.githubSecretName | quote }}
            # The App credentials live here and only here. With both present the
            # controller mints a token per repository under review and gives a
            # reviewer Job only that; without them it falls back to the shared
            # token in the same Secret. Optional, so an install using a personal
            # access token is unaffected.
            - name: BOSUN_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubSecretName }}
                  key: app-id
                  optional: true
            - name: BOSUN_GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubSecretName }}
                  key: private-key
                  optional: true
            # The termination sentinel publishes on behalf of a reviewer that
            # was killed before it could publish for itself. With an App above
            # it mints its own narrow token and this is unused; a personal
            # access token cannot be minted, so an install using one must share
            # it here or accept that an OOM-killed review stays silent.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubSecretName }}
                  key: token
                  optional: true
            - name: BOSUN_AI_SECRET
              value: {{ .Values.secrets.aiSecretName | quote }}
{{- if not .Values.development.enabled }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.webhookSecretName }}
                  key: secret
{{- else }}
            # Development mode has no webhook secret. Signature verification
            # fails closed, so the webhook endpoint rejects every delivery and
            # reviews are driven locally by scripts/review-local.sh instead.
{{- end }}
{{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
{{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
