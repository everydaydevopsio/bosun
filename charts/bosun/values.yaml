image:
  repository: ghcr.io/everydaydevopsio/bosun
  # Empty means the chart appVersion, which the release workflow sets to the
  # released version. The publish workflow never pushes a "latest" tag, so a
  # literal default here would point at an image that does not exist.
  tag: ""
  pullPolicy: IfNotPresent

# Two controllers so a rollout or a lost node never leaves the webhook with no
# ready endpoint: GitHub does not redeliver a delivery that found nothing
# listening. Admission, the queue dispatcher, the sentinel and the sweep all
# coordinate through namespace Leases, so replicas are safe to add.
replicaCount: 2

# Seconds a terminating controller keeps serving before it begins draining.
# The ingress keeps routing to a pod for a moment after it starts terminating;
# without this pause those deliveries hit a closed listener and are lost.
preStopSleepSeconds: 10
# Must cover preStopSleepSeconds plus the controller's 25s drain.
terminationGracePeriodSeconds: 45
review:
  provider: codex-bosun
  # How hard the reviewer works. standard keeps the provider's default; deep
  # raises Codex's reasoning effort and Claude's effort level to high, at
  # higher cost and duration. auto runs standard, and deep when the change has
  # more reviewable lines than escalateAboveLines. Each review records the
  # level that ran and, when escalated, why.
  effort: auto
  # Added plus deleted lines, lockfiles and generated files excluded, above
  # which an auto review runs at deep. 0 disables escalation. standard or deep
  # in effort is never escalated.
  escalateAboveLines: 800
  # Empty means image.repository at the chart appVersion.
  image: ""
  ttlSecondsAfterFinished: 3600
  # A pull-request comment containing this phrase (case-insensitive) requests a
  # review. "@bosun-review" is a GitHub account the project reserves, so the
  # mention autocompletes and notifies nobody else. Releases before 0.3.0 used
  # "@bridgectl review"; set that here to keep the old phrase working.
  command: "@bosun-review review"
  # Comment authors permitted to spend model credits with the review command.
  allowedAssociations: "OWNER,MEMBER,COLLABORATOR"
  triggers:
    # Review a branch as soon as it is pushed, before any pull request exists.
    #
    # Off by default. A branch push and the pull request opened from it review
    # the same commit, so `git push -u` followed by `gh pr create` pays for two
    # identical reviews. maxConcurrent below is counted across the namespace,
    # not per repository, so the duplicate takes a slot and delays the review
    # of the pull request opened moments later, or, with the queue disabled,
    # leaves it rejected with 503 -- which GitHub does not redeliver.
    #
    # Turn this on when branches are pushed that will not become pull requests
    # soon. Those reviews have no pull request to post to, so they publish as a
    # check run on the commit, which needs the App's optional Checks
    # permission. Without it they are reported at WARN and nothing is posted.
    branchCreated: false
  # Reviews allowed to run at once, counted across the namespace. This is what
  # bounds load on the cluster: further requests wait in the queue below
  # rather than starting a pod.
  maxConcurrent: 3
  # Reviews that arrive while maxConcurrent are running wait here instead of
  # being refused. A queued review is a suspended Job with no pod, so it costs
  # an API object, not node capacity. The controller starts the oldest queued
  # review as soon as a slot frees, and a newer request for the same pull
  # request replaces its queued predecessor.
  queue:
    # Reviews allowed to wait. When the queue is full a request is refused
    # with 503, which GitHub does not redeliver. 0 disables queueing and
    # refuses every request that arrives at capacity.
    maxQueued: 50
    # How often the controller looks for a free slot.
    intervalSeconds: 10
    # A queued review that has waited this long is dropped and logged at
    # ERROR. 0 keeps it until a slot frees.
    timeoutSeconds: 7200
  # Finds open pull requests whose head commit Bosun never reviewed -- a
  # webhook lost before it was stored, during a rollout or an outage -- and
  # requests the review through the normal path. Reads GitHub with a read-only
  # installation token; needs a GitHub App. Matches Bosun's own publications
  # (reviews and failure comments) by head commit, so a reviewed commit is
  # never reviewed twice.
  sweep:
    # 0 disables the sweep.
    intervalSeconds: 300
    # Only pull requests updated this recently, so turning the sweep on does
    # not review a backlog.
    lookbackSeconds: 86400
    # Pull requests updated more recently than this are left to their webhook.
    graceSeconds: 300
    # Most reviews one pass may request; the rest wait for the next pass.
    maxPerPass: 10
  # How long one review may run. The Job deadline is derived from this.
  timeoutSeconds: 1800
  # A reviewer killed for exceeding resources.limits.memory dies on SIGKILL and
  # cannot publish its own failure, so the controller publishes it instead.
  # Without this a review that hits the limit tells the pull request nothing at
  # all. Set intervalSeconds to 0 to turn the check off and accept that silence.
  terminationSentinel:
    intervalSeconds: 30
  # Resources for the reviewer Job. Requests are the half that matters: with
  # none, the reviewer is BestEffort, the scheduler cannot tell whether a
  # second concurrent review fits, and maxConcurrent is the only thing between
  # a busy repository and an overcommitted node.
  #
  # Measured on a 14-file diff against a DOKS node: 217m CPU and 223Mi peak,
  # sampled at the 15s metrics-server interval. The defaults below carry
  # roughly 2x headroom on memory for larger diffs, and a CPU limit that lets
  # a review burst without starving the controller that launched it. Measure
  # your own worst case before raising them.
  #
  # Set any entry to "" to omit it.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

logging:
  # text (slog-style key=value) or json
  format: text
  level: info

securityContext:
  # UID of the "bridge" user in the bridgectl base image.
  runAsUser: 1001

secrets:
  # Create these out-of-band. Never commit values here.
  githubSecretName: bosun-github
  aiSecretName: bosun-ai
  webhookSecretName: bosun-webhook

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: bosun.example.com
  tlsSecretName: bosun-tls
  # Controller-specific settings go here. cert-manager issues the TLS
  # certificate from an annotation, so without this there is no way to request
  # one through the chart:
  #   cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  # Restricts reviewer Jobs to DNS and HTTPS so a prompt-injected agent cannot
  # reach other workloads in the cluster.
  enabled: false

development:
  # Enables installation without GitHub/webhook secrets. Local reviews are
  # launched directly as Kubernetes Jobs by scripts/review-local.sh.
  enabled: false
